name: Make voice
on: workflow_dispatch
jobs:
  voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install edge-tts
      - run: python voice.py
      - uses: actions/upload-artifact@v4
        with:
          name: voice
          path: voice.mp3
          
